[workspace]
resolver = "2"
members = [
    "crates/cas",
    "crates/store",
    "crates/resolve",
    "crates/upload-protocol",
    "services/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV is set by our dependency floor and enforced by CI.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustly-tech/storage"
authors = ["Rustly contributors"]

[workspace.dependencies]
rustly-cas = { path = "crates/cas", version = "0.1.0" }
rustly-store = { path = "crates/store", version = "0.1.0" }

async-trait = "0.1"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1.8"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
