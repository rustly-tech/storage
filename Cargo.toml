[workspace]
resolver = "2"
members = ["crates/cas", "crates/store", "crates/resolve"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV is set by our dependency floor and enforced by CI.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustly-tech/fabric"
authors = ["Rustly contributors"]

[workspace.dependencies]
rustly-cas = { path = "crates/cas", version = "0.1.0" }
rustly-store = { path = "crates/store", version = "0.1.0" }

async-trait = "0.1"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
