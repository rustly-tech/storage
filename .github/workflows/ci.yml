name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "51 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: rustly-tech/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.88.0"
      features: "--all-features"

  security:
    uses: rustly-tech/.github/.github/workflows/rust-security.yml@main

  integrity:
    name: integrity corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: integrity

      # The premise of this repository is that bytes are trustworthy because
      # they are verified. These give that claim its own signal, rather than
      # letting it hide inside an aggregate pass.
      - name: Both store backends behave identically
        run: cargo test -p rustly-store --test conformance -- --nocapture

      - name: Corruption, truncation, and partial writes are detected
        run: |
          set -euo pipefail
          for test in \
            the_filesystem_store_detects_corruption_on_read_and_evicts_it \
            the_memory_store_detects_corruption_on_read_too \
            a_truncated_object_is_detected \
            a_partial_write_never_becomes_a_readable_object; do
            cargo test -p rustly-store --test conformance -- --exact "$test" --nocapture
          done

      - name: A lying peer cannot poison the cache
        run: |
          set -euo pipefail
          for test in \
            a_lying_peer_is_rejected_and_the_next_source_answers \
            a_lying_peer_never_poisons_the_local_cache \
            every_response_is_verified_against_the_requested_cid_not_just_any_cid; do
            cargo test -p rustly-resolve --test resolution -- --exact "$test" --nocapture
          done

      - name: Degrading under quota pressure never spends
        run: |
          cargo test -p rustly-resolve --test resolution -- \
            --exact a_metered_source_is_skipped_when_spending_is_not_permitted --nocapture

  remote-store:
    name: S3-compatible store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: remote-store
      - name: Start a private MinIO test bucket
        run: |
          docker run --rm -d --name rustly-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=rustly-test \
            -e MINIO_ROOT_PASSWORD=rustly-test-secret-change-me \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            docker exec rustly-minio curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          docker run --rm --network container:rustly-minio --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            'mc alias set local http://127.0.0.1:9000 rustly-test rustly-test-secret-change-me >/dev/null && mc mb local/rustly-test >/dev/null'
      - name: Run the remote-store contract and fault tests
        run: cargo test -p rustly-store --features s3 --test s3_conformance -- --ignored --test-threads=1
      - name: Stop MinIO
        if: always()
        run: docker stop rustly-minio || true

  container:
    name: artifact gateway image
    runs-on: ubuntu-latest
    needs: [rust, remote-store]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the image
        run: docker build -t rustly-artifact-gateway:${{ github.sha }} .
      - name: Smoke test the image
        run: |
          set -euo pipefail
          trap 'docker rm -f artifact-gateway >/dev/null 2>&1 || true' EXIT
          docker run -d --name artifact-gateway -p 127.0.0.1:8081:8081 \
            -e RUSTLY_ARTIFACT_TOKEN_SECRET=ci-upload-secret-is-at-least-32-bytes \
            -e RUSTLY_ARTIFACT_READ_SECRET=ci-read-secret-is-at-least-32-bytes \
            -e RUSTLY_ARTIFACT_DIR=/tmp/rustly-artifacts \
            rustly-artifact-gateway:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null; then break; fi
            sleep 1
          done
          [ "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/health)" = 204 ]
          docker rm -f artifact-gateway
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository }}/gateway
          docker tag rustly-artifact-gateway:${{ github.sha }} "$image:${{ github.sha }}"
          docker push "$image:${{ github.sha }}"
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            docker tag rustly-artifact-gateway:${{ github.sha }} "$image:main"
            docker push "$image:main"
          fi
      - name: Generate an SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: rustly-artifact-gateway:${{ github.sha }}
          artifact-name: rustly-artifact-gateway-sbom.spdx.json
